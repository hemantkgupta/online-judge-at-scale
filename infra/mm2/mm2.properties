# ===========================================================================
# MirrorMaker 2 — regional Kafka → global Kafka replication
#
# Plays the same role as Confluent Cluster Linking in the blog's design
# (Part 8): every region's verdict stream is replicated into a single global
# cluster so a unified Flink job can score across regions. MirrorMaker 2 is
# Apache Kafka's open-source replication driver (Apache 2.0) — no vendor
# lock-in, ships with every Kafka distribution.
#
# Topology in docker-compose:
#   * regional cluster → service `kafka`        (bootstrap kafka:29092)
#   * global   cluster → service `kafka-global` (bootstrap kafka-global:29093)
#
# Replicated topics (regex):
#   * `evaluated_results`       — per-region verdict stream the global Flink
#                                  job consumes for scoring
#   * `submissions\.(pretest|system)` — useful for cross-region observability
#
# Naming on the destination side follows MM2's DefaultReplicationPolicy:
#   regional.evaluated_results, regional.submissions.pretest, ...
# (i.e. `<source-cluster-alias>.<topic>`). Consumers on the global side read
# the prefixed topic name.
# ===========================================================================

# Cluster aliases used in topic renaming and connector names.
clusters = regional, global

# Bootstrap servers for each cluster.
regional.bootstrap.servers = kafka:29092
global.bootstrap.servers   = kafka-global:29093

# Enable replication one-way: regional → global. (Add `global->regional.enabled = true`
# to make it active/active — not needed for this design.)
regional->global.enabled = true
regional->global.topics  = evaluated_results,submissions\\.(pretest|system)

# Allow MM2 to auto-create the mirrored topics on the destination cluster.
regional->global.sync.topic.acls.enabled         = false
regional->global.sync.topic.configs.enabled      = true
regional->global.emit.heartbeats.enabled         = true
regional->global.emit.checkpoints.enabled        = true
regional->global.replication.factor              = 1

# MM2 stores its own bookkeeping (offset translation, heartbeats) in
# internal Kafka topics on each cluster. RF=1 because this is a
# single-broker demo; in production these would be RF=3.
checkpoints.topic.replication.factor    = 1
heartbeats.topic.replication.factor     = 1
offset-syncs.topic.replication.factor   = 1
offset.storage.replication.factor       = 1
status.storage.replication.factor       = 1
config.storage.replication.factor       = 1

# Refresh + sync intervals: tight for the local demo so the smoke test
# sees replication promptly. Production values are seconds-to-minutes.
refresh.topics.interval.seconds         = 5
sync.topic.configs.interval.seconds     = 10
emit.heartbeats.interval.seconds        = 5
emit.checkpoints.interval.seconds       = 5
