# =============================================================================
# Control-plane VM compose stack.
#
# Runs on the oj-control-plane VM (10.0.0.2) and provides every regional
# service that is NOT the execution-worker:
#   * zookeeper :2181      (kafka coordinator)
#   * kafka     :9092      (off-VM clients) + :29092 (in-VPC, internal)
#   * cockroachdb :26257
#   * redis     :6379
#   * api-gateway :8088
#
# Stage 4's control-plane.sh startup script:
#   1. installs Docker on the VM,
#   2. authenticates docker to Artifact Registry,
#   3. drops this file at /opt/oj/control-plane-compose.yml,
#   4. drops an /opt/oj/.env with KAFKA_HOST_EXTERNAL=10.0.0.2 + AR_URL,
#   5. systemd unit `oj-control-plane.service` runs `docker compose -f ... up -d`
#      on every boot.
#
# Environment file (set by control-plane.sh):
#   KAFKA_HOST_EXTERNAL     control-plane internal IP (e.g. 10.0.0.2)
#   AR_URL                  Artifact Registry repo URL
#   JWT_SECRET              32+ byte secret for api-gateway
# =============================================================================

services:
  # OpenTelemetry collector (roadmap §2.6). Receives OTLP from every JVM
  # service on this VM (and from the compute VM across the VPC) and exports
  # to Cloud Trace + Cloud Monitoring + Cloud Logging. The control-plane
  # VM's SA has the required roles via terraform (monitoring.metricWriter,
  # cloudtrace.agent, logging.logWriter); ADC picks them up from the GCE
  # metadata server, no key file mounted.
  #
  # Bring-up sequence (operator):
  #   1. terraform apply (lands the new IAM bindings + monitoring API enable)
  #   2. control-plane.sh redeploys this stack → collector boots, runs
  #      health check, becomes ready
  #   3. ONLY THEN flip OTEL_JAVAAGENT_ENABLED=true in /opt/oj/.env and
  #      bounce each service. The default in this compose stays `false`
  #      so a partial deploy can never crash-loop every JVM at once.
  oj-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: oj-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - /opt/oj/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC — accepts spans from oj-compute too
      - "8888:8888"  # collector self-metrics
      - "13133:13133" # health probe
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    cpus: 0.5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: oj-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: oj-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"  # exposed on host's interface so the compute VM can reach it
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for in-VM clients (api-gateway via the docker
      # network), one for off-VM clients (the compute VM via the host LAN IP).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_HOST_EXTERNAL:-127.0.0.1}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Roadmap §2.7 stepping-stone hardening (still single-broker for now):
      # * AUTO_CREATE_TOPICS_ENABLE=false — every topic must be created via
      #   the bootstrap step (infra/scripts/kafka-bootstrap-topics.sh) with
      #   the right partition count + retention. Stops the typo-creates-a-
      #   topic class of bugs and forces an explicit conversation when a
      #   new topic is added.
      # * min.insync.replicas=1 because we have one broker; this is the
      #   correct value for the cluster size, and is what min.insync.replicas
      #   will need to be re-tuned to (=2) once the 3-broker move lands.
      # * Producer-side acks=all is set in each service's Kafka config
      #   (api-gateway / execution-worker) — it works on a single broker
      #   (waits for the local leader to fsync) and is correct under 3 brokers
      #   too. See infra/gcp/compose/_kafka-3broker.md for the migration plan
      #   to actual ISR=2/RF=3 durability.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  cockroachdb:
    # Same version we used on the Pi & Mac smoke tests so the schema
    # migrations apply identically.
    image: cockroachdb/cockroach:v24.1.10
    container_name: oj-cockroachdb
    restart: unless-stopped
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"   # admin UI (web)
    volumes:
      - cockroachdb-data:/cockroach/cockroach-data
      # init.sql mount removed in V3: Flyway in api-gateway is the single
      # source of truth for schema. The api-gateway container runs migrations
      # on startup against the `onlinejudge` database, which CRDB creates
      # implicitly on first connection (or you can `CREATE DATABASE
      # onlinejudge` manually on a fresh cluster — see infra/scripts/
      # db-migration-onlinejudge.sql for the operator runbook).

  redis:
    image: redis:7.2
    container_name: oj-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  api-gateway:
    image: ${AR_URL:?must set AR_URL via /opt/oj/.env}/api-gateway:latest
    container_name: oj-api-gateway
    restart: unless-stopped
    depends_on:
      - kafka
      - cockroachdb
      - redis
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Unified DB (post-V3). Was `defaultdb` until V3 collapsed the two-database split.
      SPRING_DATASOURCE_URL: jdbc:postgresql://cockroachdb:26257/onlinejudge?sslmode=disable
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: ${JWT_SECRET:?must set JWT_SECRET via /opt/oj/.env}
      # Flyway compatibility settings: pre-V3, `onlinejudge` already had some
      # tables from the old init.sql path. baseline-version=0 forces V1 to
      # run (V1's CREATE TABLE IF NOT EXISTS handles the partial-overlap
      # case cleanly). baseline-on-migrate=true so Flyway accepts the pre-
      # existing schema without an explicit `flyway baseline` invocation.
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION:    "0"
      APP_REGION: ${REGION:-asia-south1}
      # ── OpenTelemetry (Workstream H) ─────────────────────────────
      # OTel agent disabled at JVM start until we have a real collector +
      # working endpoint config. The agent JAR stays baked in the image;
      # only the bootstrap is skipped. Flip OTEL_JAVAAGENT_ENABLED=true
      # in /opt/oj/.env when you also set a reachable OTEL_ENDPOINT.
      OTEL_JAVAAGENT_ENABLED:      ${OTEL_JAVAAGENT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://localhost:4317}
      OTEL_SERVICE_NAME:           oj-api-gateway
      OTEL_RESOURCE_ATTRIBUTES:    deployment.environment=gcp,region=${REGION:-asia-south1}

  # problem-service: signs V4 GCS download URLs for test-case inputs/expected-
  # outputs. The execution-worker reaches it over HTTP via ProblemServiceClient
  # (env APP_PROBLEM_SERVICE_URL=http://<control-plane-ip>:8089). The signer
  # SA's JSON key is mounted from /opt/oj/gcs-signer.json, which control-plane.sh
  # fetches from Secret Manager on every boot.
  #
  # MEMORY: e2-medium has 4 GB total; with kafka + zookeeper + cockroachdb +
  # redis + api-gateway already running we cap problem-service's JVM heap to
  # 384 MB to leave headroom. -XX:MaxRAMPercentage is ignored when
  # JAVA_TOOL_OPTIONS is set explicitly.
  problem-service:
    image: ${AR_URL:?must set AR_URL via /opt/oj/.env}/problem-service:latest
    container_name: oj-problem-service
    restart: unless-stopped
    depends_on:
      - cockroachdb
    ports:
      - "8089:8089"
    volumes:
      # Signer SA JSON key — fetched from Secret Manager by control-plane.sh
      # on every boot. Mode 0400 on the host, ro mount in the container.
      - /opt/oj/gcs-signer.json:/var/secrets/gcs-signer.json:ro
    environment:
      SERVER_PORT: 8089
      # Post-V3: single canonical database `onlinejudge`. api-gateway owns the
      # Flyway migrations (V1..V3) for ALL tables, including problems and
      # test_cases. problem-service is a pure JPA consumer here — no schema
      # ownership, no init.sql.
      DB_URL: jdbc:postgresql://cockroachdb:26257/onlinejudge?sslmode=disable
      DB_USER: root
      # Now that the entity fields use Java `long` for time_limit_ms /
      # memory_limit_mb / points (matching CRDB's BIGINT-flavoured `INT`),
      # ddl-auto=validate is the right end state. Removed the previous
      # `SPRING_JPA_HIBERNATE_DDL_AUTO: none` override — the application.yml
      # default (validate) is correct.
      GCS_PROJECT_ID: ${PROJECT_ID:-online-judge-hk}
      GCS_BUCKET: ${GCS_BUCKET:?must set GCS_BUCKET via /opt/oj/.env}
      GCS_SIGNER_KEY_PATH: /var/secrets/gcs-signer.json
      APP_REGION: ${REGION:-asia-south1}
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:+ExitOnOutOfMemoryError"
      # ── OpenTelemetry (Workstream H) ─────────────────────────────
      OTEL_JAVAAGENT_ENABLED:      ${OTEL_JAVAAGENT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://localhost:4317}
      OTEL_SERVICE_NAME:           oj-problem-service
      OTEL_RESOURCE_ATTRIBUTES:    deployment.environment=gcp,region=${REGION:-asia-south1}

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  cockroachdb-data:
  redis-data:
