# =============================================================================
# Compute VM compose stack — Part 7's three trust zones split into two
# containers (the third is inside the microVM):
#
#   * oj-sandbox-manager  Per-host privileged daemon. Owns /dev/kvm,
#                         /var/run/docker.sock, the Firecracker binary
#                         + rootfs + kernel, and the vsock UDS files
#                         that talk to in-guest agents. Exposes the
#                         lease/exec/release HTTP API on :9100 (intra-VM).
#
#   * oj-execution-worker Unprivileged-ish. Kafka consumer + verdict
#                         publisher. Calls oj-sandbox-manager over HTTP
#                         for everything sandbox-shaped. Loses /dev/kvm
#                         and the Firecracker mounts entirely.
#
# Both containers share /tmp via volume mount so per-lease vsock UDS
# files created by the SM are visible to anyone who *might* want to
# bypass it — today nobody does, but the layout matches the blog's
# direct Service↔Agent vsock pattern if we ever drop the HTTP hop.
#
# Environment (set by compute.sh from /opt/oj/.env):
#   AR_URL, CONTROL_PLANE_IP, REGION,
#   APP_SANDBOX_BACKEND, APP_SANDBOX_DOCKER_RUNTIME,
#   APP_SANDBOX_LINUX_HARDENING_ENABLED
# =============================================================================

services:

  oj-sandbox-manager:
    image: ${AR_URL:?must set AR_URL via /opt/oj/.env}/sandbox-manager:latest
    container_name: oj-sandbox-manager
    restart: unless-stopped
    privileged: true                         # KVM, ptrace, kill
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      # Firecracker binary + the harness rootfs + guest kernel live on the
      # host and are bind-mounted in. compute.sh provisions them on first
      # boot via build-rootfs.sh.
      - /usr/local/bin/firecracker:/usr/local/bin/firecracker:ro
      - /var/lib/firecracker:/var/lib/firecracker:ro
      # Per-lease Firecracker API sockets + vsock UDS files land in /tmp.
      - /tmp:/tmp
    environment:
      APP_FIRECRACKER_BINARY:        /usr/local/bin/firecracker
      APP_FIRECRACKER_KERNEL_IMAGE:  /var/lib/firecracker/vmlinux
      APP_FIRECRACKER_ROOTFS_IMAGE:  /var/lib/firecracker/rootfs.ext4
      APP_FIRECRACKER_API_SOCK_DIR:  /tmp
      APP_FIRECRACKER_VSOCK_UDS_DIR: /tmp
      APP_AGENT_VSOCK_CLIENT:        /usr/local/bin/oj-vsock-client
      APP_REGION:                    ${REGION:-asia-south1}
      # ── OpenTelemetry (Workstream H) ─────────────────────────────
      # The OTel Java agent (baked into the image) crashes during JVM
      # premain via two paths even when the exporter trio is set to "none":
      #
      #   1. OtlpConfigUtil.validateEndpoint("") MalformedURL when the
      #      endpoint env var is empty
      #   2. OtlpMetricExporterProvider.createExporter is still called by
      #      autoconfigure even with OTEL_METRICS_EXPORTER=none, and re-
      #      validates the endpoint, throwing again
      #
      # Until we have a real collector to export to AND can configure the
      # agent properly, the simplest correct posture is to keep the agent
      # JAR in the image (it's baked in by the Dockerfile) but tell it not
      # to load at JVM start. OTEL_JAVAAGENT_ENABLED=false is honoured by
      # the agent's bootstrap before it touches the SDK autoconfig.
      OTEL_JAVAAGENT_ENABLED:      ${OTEL_JAVAAGENT_ENABLED:-false}
      # When the operator wants real export: set OTEL_JAVAAGENT_ENABLED=true
      # AND set OTEL_ENDPOINT to a reachable OTLP endpoint in /opt/oj/.env.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://localhost:4317}
      OTEL_SERVICE_NAME:           oj-sandbox-manager
      OTEL_RESOURCE_ATTRIBUTES:    deployment.environment=gcp,region=${REGION:-asia-south1}

  oj-execution-worker:
    image: ${AR_URL:?must set AR_URL via /opt/oj/.env}/execution-worker:latest
    container_name: oj-execution-worker
    restart: unless-stopped
    # The Docker backend (for macOS dev parity) still wants the host Docker
    # socket so DockerExecutionService can `docker run` sibling containers.
    # The Firecracker mounts are GONE — those are now the SM's responsibility.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp                              # shared with SM (mainly for FC's UDS files)
      - /etc/seccomp:/etc/seccomp:ro
    depends_on:
      - oj-sandbox-manager
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${CONTROL_PLANE_IP:?must set CONTROL_PLANE_IP}:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://${CONTROL_PLANE_IP:?must set CONTROL_PLANE_IP}:26257/defaultdb?sslmode=disable
      SPRING_DATASOURCE_USERNAME: root
      APP_SANDBOX_BACKEND:                   ${APP_SANDBOX_BACKEND:-firecracker}
      APP_SANDBOX_DOCKER_RUNTIME:            ${APP_SANDBOX_DOCKER_RUNTIME:-runc}
      APP_SANDBOX_LINUX_HARDENING_ENABLED:   ${APP_SANDBOX_LINUX_HARDENING_ENABLED:-false}
      # New: where to reach the sandbox-manager. Service-to-service inside
      # the same compose network; no auth on the lease API yet (single-host
      # trust boundary).
      APP_SANDBOX_MANAGER_URL:               http://oj-sandbox-manager:9100
      APP_REGION:                            ${REGION:-asia-south1}
      # problem-service is the heaviest control-plane dependency for the
      # worker (per-test signed-URL lookups). When it isn't deployed in this
      # region — typically during the initial Firecracker/Kafka smoke test —
      # flip this to false to bypass the fetch and use a single empty
      # TestCaseSpec instead. The agent still runs the code, the worker still
      # publishes the verdict; only the WA/AC determination becomes degenerate
      # (always WA against the empty expected_hash).
      APP_PROBLEM_SERVICE_REQUIRED:          ${APP_PROBLEM_SERVICE_REQUIRED:-false}
      # ── OpenTelemetry (Workstream H) — same shape as SM above. ──
      OTEL_JAVAAGENT_ENABLED:      ${OTEL_JAVAAGENT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://localhost:4317}
      OTEL_SERVICE_NAME:           oj-execution-worker
      OTEL_RESOURCE_ATTRIBUTES:    deployment.environment=gcp,region=${REGION:-asia-south1}
