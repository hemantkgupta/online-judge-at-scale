plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    // OpenTelemetry API. Ship as `implementation` so the API classes are on
    // the application classpath at runtime. The -javaagent jar does auto-
    // instrumentation but does NOT expose its bundled API to the app's
    // classloader — SandboxMetrics's `import io.opentelemetry.api.common.Attributes`
    // would throw NoClassDefFoundError at app boot without this. The OTel
    // agent still drives the actual SDK provider behind GlobalOpenTelemetry.
    implementation 'io.opentelemetry:opentelemetry-api:1.43.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // OTel SDK + InMemoryMetricReader for SandboxMetricsTest.
    testImplementation 'io.opentelemetry:opentelemetry-sdk:1.43.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing:1.43.0'
}

springBoot {
    mainClass = 'com.onlinejudge.sandbox.SandboxManagerApplication'
}
