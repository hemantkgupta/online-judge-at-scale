server:
  port: 8080
  # Roadmap §3.6 — gateway-level submission body cap. The authoritative
  # per-field cap is @Size(max=65536) on SubmissionRequest.code (returns 400).
  # These server-side caps protect against oversized bodies BEFORE they reach
  # Spring/Jackson, so a 50 MB POST cannot exhaust JVM heap on its way to
  # being rejected.
  tomcat:
    # Bytes Tomcat will swallow (discard) on an abort. Cap at 128 KiB so we
    # don't sit reading megabytes from a closed/abusive client.
    max-swallow-size: 131072
    # Cap on form-encoded POSTs (we receive JSON so this is mostly defensive).
    max-http-form-post-size: 131072

spring:
  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads

  datasource:
    # Single canonical database. Pre-V3 we used `defaultdb` (an accident of
    # CRDB's superuser default) while problem-service used `onlinejudge`.
    # V3 unifies everything onto `onlinejudge`. Flyway in this service owns
    # schema; `database/init.sql` is retired.
    url: jdbc:postgresql://localhost:26257/onlinejudge?sslmode=disable
    username: root
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate is the right end state: Flyway V3 produces a schema that
      # matches the JPA entities exactly. If you see ddl-auto=none anywhere
      # in compose, that's a leftover from the two-database era — drop it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      retries: 3

  data:
    redis:
      host: localhost
      port: 6379

app:
  # JWT (Part 3 of the blog). HS256 with pre-shared keys for the demo; production
  # uses an IdP that signs with RS256 and the gateway only verifies.
  #
  # Key rotation: `keys.<kid>` map plus `kid-current` / `kid-previous`. New
  # tokens are signed with the key under `kid-current`. Inbound tokens whose
  # `kid` header references `kid-previous` are still accepted for one rotation
  # cycle. Every key value MUST be at least 32 bytes for HS256 — startup fails
  # otherwise.
  #
  # TODO(secret-manager): the actual key bytes should be sourced from Google
  # Secret Manager (one secret per kid) rather than env. Tracked in a separate
  # rotation pass — for now `JWT_SECRET` continues to feed keys.v1.
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-rotate-in-prod-32+chars-needed-for-HS256}
    keys:
      v1: ${JWT_KEY_V1:${JWT_SECRET:dev-only-secret-please-rotate-in-prod-32+chars-needed-for-HS256}}
      v2: ${JWT_KEY_V2:}
    kid-current: ${JWT_KID_CURRENT:v1}
    kid-previous: ${JWT_KID_PREVIOUS:}
    # Access tokens are short-lived (15 min) and stateless. Refresh tokens
    # live 7 days, sit in the refresh_tokens table, and rotate on every use.
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    # Legacy property — pre-V5 token TTL hours. Kept so the JwtTokenProvider
    # 3-arg test constructor still has a meaningful "ttl" parameter.
    ttl-hours: 8
    issuer: online-judge

  # Region this gateway pod is pinned to (tech-spec §12). In production every
  # pod is deployed into one region and writes carry this value (matched by
  # CockroachDB's REGIONAL BY ROW locality so the row's replicas live in the
  # same region). It also feeds (a) the user.region stamp on signup, (b) the
  # `region` claim on access JWTs, (c) the `${app.region}` placeholder in the
  # regional Kafka topic names below, and (d) the RegionMismatchFilter's
  # comparison against the JWT region claim.
  # Locally there's only one node — this just stamps the submissions/outbox
  # rows and propagates into the outbox payload. The `X-Region` request
  # header overrides this per-request for multi-region simulation tests.
  region: ${APP_REGION:asia-south1}
  # URL of the OTHER regional gateway. When a request arrives whose JWT
  # region claim differs from app.region above, RegionMismatchFilter sends a
  # 307 redirect to <peer-gateway-url><request-uri>. Empty in single-region
  # dev — the filter then returns 503 on mismatch so misconfigurations don't
  # silently route to the wrong data.
  peer-gateway:
    url: ${APP_PEER_GATEWAY_URL:}
  kafka:
    topic:
      # Regional topics — each gateway pod publishes only to its own region's
      # family, and the regional Flink job consumes its region's family.
      # Cross-region traffic happens at the data layer (CRDB regional reads
      # of competition state), not at the Kafka layer.
      pretest:           submissions.${app.region}.pretest
      system:            submissions.${app.region}.system
      # Roadmap §3.9 — exhausted-reconcile rows are routed here. Same
      # topic family the execution-worker uses, so a single regional tail
      # surfaces every dead submission whatever the cause.
      dlq:               submissions.${app.region}.dlq
  rate-limit:
    submissions-per-minute: 10
    submissions-per-ip-per-minute: 60
  outbox:
    # The polling outbox publisher is the default substitute for production CDC.
    # Set this to false (or env APP_OUTBOX_PUBLISHER_ENABLED=false) to use a
    # CockroachDB native changefeed instead — see database/changefeed-setup.sql.
    publisher:
      enabled: true
    poll-interval-ms: 1000
    batch-size: 50

  # Roadmap §3.9 — stuck-submission reconciliation sweep.
  #
  # Closes the failure mode where api-gateway crashed BETWEEN the
  # `submissions` row INSERT and the `outbox_events` INSERT. The outbox
  # publisher only walks the outbox table, so a submission with no
  # corresponding outbox row sits PENDING forever. The scanner walks
  # `submissions WHERE status='PENDING' AND created_at < now()-stale`
  # every interval-seconds and re-publishes a SubmissionEvent to the
  # pretest topic for each stuck row.
  #
  #   enabled              — ops kill-switch; set false to drain.
  #   interval-seconds     — sweep cadence (fixed-delay; runs N seconds
  #                          after the previous sweep finishes).
  #   stale-after-seconds  — how long PENDING must persist before we
  #                          consider it stuck. 15 min covers normal
  #                          backlogs without false positives.
  #   batch-size           — per-sweep cap; thundering-herd guard after
  #                          a long outage. Subsequent sweeps drain
  #                          the rest.
  #   max-attempts         — per-row republish cap. Past this the row
  #                          is marked FAILED and an envelope goes to
  #                          app.kafka.topic.dlq (submissions.dlq).
  reconciliation:
    enabled: true
    interval-seconds: 60
    stale-after-seconds: 900
    batch-size: 500
    max-attempts: 10

  # Workstream G — Submission source persistence.
  #   source-mode=gcs     → write source bytes to GCS BEFORE the outbox event
  #                         is created (Part 6 durability invariant). Production
  #                         default once GCS is provisioned.
  #   source-mode=data-url → embed source inline as a data: URL. Legacy /
  #                          local-dev default — no object store required.
  # Kept env-var-driven so the same image rolls forward/back without a rebuild.
  submission:
    source-mode: ${APP_SUBMISSION_SOURCE_MODE:data-url}

  gcs:
    project-id: ${GCS_PROJECT_ID:online-judge-hk}
    source-bucket: ${GCS_SOURCE_BUCKET:oj-source-dev}
