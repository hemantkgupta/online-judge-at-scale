plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'

    // Google Cloud Storage client — used by GcsWriter to durably persist
    // submission source bytes BEFORE the outbox/Kafka event references them
    // (Part 6 of the blog: write-to-object-store-first invariant).
    implementation 'com.google.cloud:google-cloud-storage:2.40.1'

    // JWT signing/verifying — JJWT (Apache 2.0), no vendor lock-in.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Argon2id password hashing for /auth/signup + /auth/login.
    // Spring Security's Argon2PasswordEncoder lives in spring-security-crypto
    // (pulled in transitively by spring-boot-starter-security) and delegates to
    // BouncyCastle for the actual Argon2 kernel — declare BC explicitly so
    // hashing works at runtime without surprise.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    // OpenTelemetry API for GatewayMetrics (tech-spec §9.3). Same version
    // and rationale as execution-worker / sandbox-manager: the -javaagent
    // jar does NOT expose its API to the application classloader, so we
    // need the API artifact on the runtime classpath to avoid a
    // NoClassDefFoundError at boot. The agent still drives the actual SDK
    // behind GlobalOpenTelemetry.
    implementation 'io.opentelemetry:opentelemetry-api:1.43.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'

    // OTel SDK + InMemoryMetricReader for GatewayMetricsTest. Brings
    // io.opentelemetry.sdk.testing.exporter.InMemoryMetricReader plus the
    // OpenTelemetrySdk builder used to install a non-no-op provider into
    // GlobalOpenTelemetry for the duration of a test.
    testImplementation 'io.opentelemetry:opentelemetry-sdk:1.43.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing:1.43.0'

    dependencyManagement {
        imports {
            mavenBom 'org.testcontainers:testcontainers-bom:1.19.7'
        }
    }
}

springBoot {
    mainClass = 'com.onlinejudge.gateway.ApiGatewayApplication'
}
