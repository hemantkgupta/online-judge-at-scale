plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'

    // Google Cloud Storage client — used by GcsWriter to durably persist
    // submission source bytes BEFORE the outbox/Kafka event references them
    // (Part 6 of the blog: write-to-object-store-first invariant).
    implementation 'com.google.cloud:google-cloud-storage:2.40.1'

    // JWT signing/verifying — JJWT (Apache 2.0), no vendor lock-in.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.5'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'

    dependencyManagement {
        imports {
            mavenBom 'org.testcontainers:testcontainers-bom:1.19.7'
        }
    }
}

springBoot {
    mainClass = 'com.onlinejudge.gateway.ApiGatewayApplication'
}
