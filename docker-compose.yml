services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ─── Regional Kafka cluster ──────────────────────────────────────
  # In production this is one of N per-region Kafka clusters that the
  # Execution Service publishes verdicts to (e.g. `evaluated_results` on
  # `kafka-us-east-1`, `kafka-eu-west-1`, etc.). Locally there is one
  # "regional" cluster — `kafka` — that all services produce to and
  # consume from on the regional path. MirrorMaker 2 (below) replicates
  # its topics into `kafka-global` to model the regional → global hop.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Advertise to host-side clients via $KAFKA_HOST_EXTERNAL when set
      # (e.g. the Mac's LAN IP so a remote execution-worker on a Raspberry Pi
      # can reach this broker over the LAN). Defaults to localhost for the
      # single-host case so existing dev workflows keep working unchanged.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_HOST_EXTERNAL:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  # ─── Global Kafka cluster (MirrorMaker 2 destination) ────────────
  # Second Kafka cluster representing the global aggregation tier. In
  # production every region's `evaluated_results` is replicated here by
  # MirrorMaker 2 so a single global Flink job can score across regions.
  # Locally we run one regional broker (`kafka`) and one global broker
  # (`kafka-global`) with MM2 streaming between them. Same architectural
  # shape as the blog's Confluent Cluster Linking design, with zero
  # vendor lock-in — MM2 ships inside Apache Kafka itself (Apache 2.0).
  kafka-global:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      # Sharing one ZK ensemble is fine for the demo — separate ZK is a
      # multi-node production concern. Each broker owns its own data dir
      # under a distinct cluster ID (KAFKA_BROKER_ID=2 above).
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ZOOKEEPER_CONNECT_NAMESPACE: kafka-global
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-global:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  # MirrorMaker 2 — the open-source equivalent of Confluent Cluster Linking.
  # Runs the dedicated MM2 driver (`connect-mirror-maker.sh`) packaged with
  # Apache Kafka and replicates topics from the regional cluster (`kafka`)
  # to the global cluster (`kafka-global`). Topics are renamed by MM2's
  # DefaultReplicationPolicy as `<source-alias>.<topic>` — e.g.
  # `regional.evaluated_results` on `kafka-global`. The global Flink job
  # consumes that prefixed topic.
  mirrormaker2:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - kafka
      - kafka-global
    volumes:
      - ./infra/mm2/mm2.properties:/etc/mm2/mm2.properties
    command: >
      bash -c "
        echo '[mm2] Waiting for both Kafka clusters to be reachable...';
        until kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1 \
          && kafka-broker-api-versions --bootstrap-server kafka-global:29093 >/dev/null 2>&1; do
          sleep 2;
        done;
        echo '[mm2] Both clusters ready — starting MirrorMaker 2';
        connect-mirror-maker /etc/mm2/mm2.properties
      "

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  # Read replica of the primary Redis instance. Demonstrates the leaderboard
  # read-replica pattern from Part 9 of the blog: writes go to primary, reads
  # served from the replica. Single-host docker-compose can't model
  # *regional* replicas, but the read/write split + async replication lag
  # are real and observable here.
  #
  # The leaderboard-service auto-detects this replica via
  # `app.redis.replica.host` (set in its application.yml) and routes
  # ZREVRANGE/ZREVRANK/ZSCORE/ZCARD through it. Writes (the verdict-cache
  # SET in VerdictPushConsumer) continue to go to the primary.
  redis-replica:
    image: redis:7.2
    depends_on:
      - redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --replicaof redis 6379 --replica-read-only yes

  cockroachdb:
    # v24.1+ ships free-tier CDC for ALL sinks (Kafka, S3, webhook) — enables the
    # real CREATE CHANGEFEED ... INTO 'kafka://...' flow documented in
    # database/changefeed-setup.sql. Earlier versions only allowed Core
    # changefeeds (stdout) without an Enterprise license.
    image: cockroachdb/cockroach:v24.1.10
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "18080:8080"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./database/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      CLICKHOUSE_DB: onlinejudge
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""

  # Flink cluster for scoring-pipeline job
  jobmanager:
    image: flink:1.18-java17
    depends_on:
      - kafka-global
      - redis
    ports:
      - "18081:8081"
    command: jobmanager
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-global:29093
      SCORING_INPUT_TOPIC: regional.evaluated_results
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHECKPOINT_DIR: file:///tmp/flink-checkpoints
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints

  taskmanager:
    image: flink:1.18-java17
    depends_on:
      - jobmanager
      - kafka-global
      - redis
    command: taskmanager
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-global:29093
      SCORING_INPUT_TOPIC: regional.evaluated_results
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHECKPOINT_DIR: file:///tmp/flink-checkpoints
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints

  # ─── Observability: SigNoz stack ────────────────────────────────
  # SigNoz provides distributed tracing, metrics, and logs in one UI.
  # Services send telemetry to the OTel Collector via OTLP (gRPC :4317).
  # The collector exports to SigNoz's ClickHouse backend.
  #
  # To instrument a Spring Boot service:
  #   JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
  #   OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  #   OTEL_SERVICE_NAME: api-gateway

  otel-collector:
    image: signoz/signoz-otel-collector:0.88.25
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      - clickhouse-signoz

  clickhouse-signoz:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "9001:9000"
      - "8124:8123"
    environment:
      CLICKHOUSE_DB: signoz_traces
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""

  signoz:
    image: signoz/frontend:0.45.0
    ports:
      - "3301:3301"
    depends_on:
      - otel-collector
    environment:
      SIGNOZ_API_URL: http://otel-collector:4317
