version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  cockroachdb:
    image: cockroachdb/cockroach:v23.1.10
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./database/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      CLICKHOUSE_DB: onlinejudge
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""

  # Flink cluster for scoring-pipeline job
  jobmanager:
    image: flink:1.18-java17
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints

  taskmanager:
    image: flink:1.18-java17
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints

  # ─── Observability: SigNoz stack ────────────────────────────────
  # SigNoz provides distributed tracing, metrics, and logs in one UI.
  # Services send telemetry to the OTel Collector via OTLP (gRPC :4317).
  # The collector exports to SigNoz's ClickHouse backend.
  #
  # To instrument a Spring Boot service:
  #   JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
  #   OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  #   OTEL_SERVICE_NAME: api-gateway

  otel-collector:
    image: signoz/signoz-otel-collector:0.88.25
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      - clickhouse-signoz

  clickhouse-signoz:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "9001:9000"
      - "8124:8123"
    environment:
      CLICKHOUSE_DB: signoz_traces
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""

  signoz:
    image: signoz/frontend:0.45.0
    ports:
      - "3301:3301"
    depends_on:
      - otel-collector
    environment:
      SIGNOZ_API_URL: http://otel-collector:4317
