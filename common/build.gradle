plugins {
    id 'java-library'
    id 'com.google.protobuf'
}

dependencies {
    // `api` so every consumer of `:common` gets the protobuf-java runtime
    // transitively. The generated event classes (Events.java) reference
    // com.google.protobuf.* on their public API surface — without this they
    // wouldn't be usable downstream without each module re-declaring the dep.
    api 'com.google.protobuf:protobuf-java:3.25.1'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.1"
    }
}

test {
    useJUnitPlatform()
}
