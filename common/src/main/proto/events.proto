syntax = "proto3";

package com.onlinejudge.events;
option java_package = "com.onlinejudge.common.events";
option java_outer_classname = "Events";

message SubmissionEvent {
  string submission_id = 1;
  string user_id = 2;
  string problem_id = 3;
  string contest_id = 4;
  string s3_code_url = 5;
  string language = 6;
  int64 gateway_ts_ms = 7;
  // Region the API gateway pod that accepted this submission was pinned to —
  // becomes the REGIONAL BY ROW key on the CRDB write. See database/multi-region-setup.sql.
  string region = 8;
  // "pretest" or "system" — execution-worker dispatches phase-specific
  // consumers by topic (submissions.pretest vs submissions.system), but the
  // phase travels on the envelope too for telemetry / log clarity.
  string phase = 9;
}

message VerdictEvent {
  string submission_id = 1;
  string user_id = 2;
  string problem_id = 3;
  string contest_id = 4;
  string result = 5; // ACCEPTED, WRONG_ANSWER, TIME_LIMIT_EXCEEDED, etc.
  int32 execution_time_ms = 6;
  int32 memory_used_mb = 7;
  int64 gateway_ts_ms = 8;
  int32 points = 9;
  // The phase this verdict was produced by ("pretest" or "system"). Scoring
  // and analytics consumers filter or branch on this.
  string phase = 10;
  // Region of origin (mirrors submission's region).
  string region = 11;
  // Event-time stamp the consumer should treat as authoritative for late-arrival
  // correction in Flink scoring. Equals gateway_ts_ms in the happy path; an
  // out-of-order verdict carries the same timestamp it had at the gateway.
  int64 event_ts_ms = 12;
}

message AnalyticsEvent {
  string submission_id = 1;
  string user_id = 2;
  string problem_id = 3;
  string contest_id = 4;
  string language = 5;
  string verdict = 6;
  int32 execution_time_ms = 7;
  int32 memory_used_mb = 8;
  int64 event_ts_ms = 9;
  string region = 10;
  string phase = 11;
}
