plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter'
    // spring-boot-starter-json registers the ObjectMapper bean (used by
    // SubmissionConsumer's JSON-envelope fallback path for CRDB changefeed
    // input). We don't pull in spring-boot-starter-web because this is a
    // worker, not a web service.
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:kafka'

    dependencyManagement {
        imports {
            mavenBom 'org.testcontainers:testcontainers-bom:1.19.7'
        }
    }
}

springBoot {
    mainClass = 'com.onlinejudge.worker.ExecutionWorkerApplication'
}
