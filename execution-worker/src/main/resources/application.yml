server:
  port: 8081

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    # Unified DB (post-V3). The execution-worker reads idempotency_keys/
    # outbox_events alongside api-gateway, so it must point at the same
    # database. Override in compose via SPRING_DATASOURCE_URL.
    url: jdbc:postgresql://localhost:26257/onlinejudge?sslmode=disable
    username: root
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: execution-worker-t1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      max-poll-records: 1        # One submission at a time per worker thread
      enable-auto-commit: false  # Manual offset commit after verdict
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    listener:
      # SubmissionConsumer takes an Acknowledgment parameter and calls
      # ack.acknowledge() only AFTER the verdict has been published. That
      # requires MANUAL_IMMEDIATE ack mode — Spring Kafka's default (BATCH)
      # would silently auto-commit and refuse to inject the Acknowledgment.
      ack-mode: MANUAL_IMMEDIATE

app:
  kafka:
    topic:
      pretest: submissions.pretest
      system: submissions.system
      evaluated-results: evaluated_results
      analytics: analytics_events
      # Roadmap §2.5 — dead-letter sink for poisoned submissions
      # (idempotency attempts cap exceeded). Operators replay manually
      # after fixing the root cause.
      dlq: submissions.dlq
  # Roadmap §2.5 — bound the idempotency reclaim loop.
  idempotency:
    processing-lease-seconds: 300
    max-attempts: 5
  execution:
    timeout-seconds: 5
    memory-limit-mb: 256
    # Production: Firecracker MicroVM. Local: Docker container with resource limits.
    mode: docker

  # Sandbox runtime + Linux-only hardening (Part 7 of the blog).
  #
  #   backend=docker        Cross-platform default. Docker container + cgroup
  #                         resource limits. macOS / Linux.
  #   backend=firecracker   Per-submission Firecracker microVM via REST API.
  #                         Linux ONLY (requires /dev/kvm). Operator notes in
  #                         infra/firecracker/README.md.
  #
  # `linux-hardening.enabled=true` flips Seccomp-BPF + capability drop +
  # `no-new-privileges` + private cgroup namespace on the Docker backend.
  # These flags are skipped on non-Linux hosts at runtime, so the setting is
  # safe to ship across the fleet.
  sandbox:
    backend: docker
    linux-hardening:
      enabled: false
    seccomp-profile: /etc/seccomp/sandbox-seccomp.json
    # OCI runtime Docker hands the container to. `runc` is the default Linux
    # runtime that ships with every Docker install. `runsc` is gVisor — must
    # be installed on the host AND registered in /etc/docker/daemon.json
    # (`runtimes: { runsc: { path: /usr/local/bin/runsc } }`). When set to a
    # non-runc value the worker adds `--runtime=<name>` to `docker run`. On
    # macOS dev machines leave this at the default — Docker for Mac ships
    # only runc.
    docker:
      runtime: runc
    # Where the Sandbox Manager service lives. Per Part 7 of the blog, the
    # SM is a separate privileged daemon (one per host) that owns KVM, the
    # Firecracker REST sockets, and vsock to the in-guest agent. The worker
    # NEVER touches /dev/kvm or the firecracker binary directly anymore.
    # Default matches the docker-compose service name on the compute VM.
    manager-url: http://oj-sandbox-manager:9100

  # The worker shells out to the same tiny Go bridge binary the SM uses
  # (oj-vsock-client) to dial the in-guest Execution Agent over Firecracker's
  # vsock. Workstream E moved this call out of the SM's data plane: the
  # worker now talks directly to the agent using the vsockUdsPath + port
  # the lease response carries. The binary is baked into the worker image
  # by stage 2 of execution-worker/Dockerfile.
  agent:
    vsock-client: /usr/local/bin/oj-vsock-client

  # Workstream B — GCS access for contestant source + test-case bytes.
  # `source-bucket` is used as the default bucket for bare-key fetches
  # (the API gateway writes gs://<bucket>/submissions/yyyy/MM/dd/<id>.txt).
  # Credentials resolve via workload identity in GKE, or
  # GOOGLE_APPLICATION_CREDENTIALS / gcloud creds in dev.
  gcs:
    source-bucket: ${GCS_SOURCE_BUCKET:oj-source-dev}
    project-id:    ${GCS_PROJECT_ID:online-judge-hk}

  # Workstream B — Problem Service base URL. Endpoint:
  # GET /api/v1/problems/{id}/test-cases?pretestOnly=<bool>
  problem-service:
    url: ${PROBLEM_SERVICE_URL:http://oj-control-plane:8089}
