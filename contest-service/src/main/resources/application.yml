server:
  port: 8084

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    # Unified DB (post-V3). Contest-service is not deployed in the current
    # compose stack; this default exists for local-dev parity with the other
    # services.
    url: jdbc:postgresql://localhost:26257/onlinejudge?sslmode=disable
    username: root
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Roadmap §2.2: Flyway in api-gateway owns the schema (V6__contests.sql).
      # contest-service is a pure JPA consumer — flipped from `update` to
      # `validate` to stop schema drift on every contest-service boot.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
