server:
  port: 8084

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    # Unified DB (post-V3). Contest-service is not deployed in the current
    # compose stack; this default exists for local-dev parity with the other
    # services.
    url: jdbc:postgresql://localhost:26257/onlinejudge?sslmode=disable
    username: root
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Roadmap §2.2: Flyway in api-gateway owns the schema (V6__contests.sql).
      # contest-service is a pure JPA consumer — flipped from `update` to
      # `validate` to stop schema drift on every contest-service boot.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all

# Tech-spec §12 (multi-region) + §4.23 (system-test replay).
# Each contest-service pod runs in one region. The two topic properties
# below are this region's local-region topics:
#
#   * system          — FALLBACK for the replay path when a submission's
#                       `region` column is null/blank. The normal replay
#                       path reads each submission's own region and writes to
#                       submissions.<that-region>.system, so a single contest's
#                       closure can fan out to multiple region-scoped topics
#                       (see SystemTestReplayPublisher).
#   * contest-events  — state-transition fanout, now per-region; each region's
#                       api-gateway and push-service pods subscribe to their
#                       own region's stream.
app:
  region: ${APP_REGION:asia-south1}
  kafka:
    topic:
      system:         submissions.${app.region}.system
      contest-events: contest_events.${app.region}
